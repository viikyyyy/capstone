<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hospital Aquiles Miro | Portal médico</title>
<style>
:root{--ink:#0b4a63;--teal:#168a9f;--muted:#5c7f90;--sky:#4db8e8;--sky-h:#38a8dc;--line:#d6e9f2;--soft:#eef7fb;--bad:#b3261e}
*{box-sizing:border-box}
html{background:#f4fafd}
body{margin:0;min-height:100dvh;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;background:radial-gradient(900px 400px at 100% 0,#dff1f9,transparent 70%),radial-gradient(700px 400px at 0 100%,#e3f4f4,transparent 70%),#f4fafd}
.wrap{max-width:1100px;margin:0 auto;padding:18px 20px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.logo{height:92px;width:auto;display:block}
.tools{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.ib{display:inline-flex;align-items:center;gap:8px;height:44px;min-width:44px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:.9rem;cursor:pointer;box-shadow:0 2px 8px rgba(11,74,99,.06);transition:background .15s,border-color .15s}
.ib:hover{background:var(--soft);border-color:var(--sky)}
.ib.pri{background:var(--sky);border-color:var(--sky);color:#06364d}.ib.pri:hover{background:var(--sky-h)}
.ib svg{width:20px;height:20px;flex:none}
.ib:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(77,184,232,.55);outline-offset:2px}
.search{display:flex;align-items:center;height:44px;width:0;opacity:0;overflow:hidden;border:1px solid var(--sky);border-radius:12px;background:#fff;transition:width .25s,opacity .2s;padding:0}
.search.open{width:min(320px,100%);opacity:1;padding:0 12px}
.search input{border:0;outline:0;width:100%;font:inherit;color:var(--ink);background:none}
.me{position:relative}
.avatar{width:52px;height:52px;border-radius:50%;padding:0;justify-content:center;background:var(--soft)}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:200px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(11,74,99,.15);padding:6px;z-index:5}
.menu .who{padding:10px 12px;border-bottom:1px solid #e9f3f8;font-size:.85rem;color:var(--muted)}.menu .who b{display:block;color:var(--ink);font-size:.95rem}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font:inherit;color:var(--ink);cursor:pointer}
.menu button:hover{background:var(--soft)}
h1{font-size:1.5rem;margin:26px 0 4px}.sub{margin:0 0 16px;color:var(--muted);font-size:.92rem}
.tw{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 30px rgba(11,74,99,.08);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px}
th{background:linear-gradient(#e6f4fa,#dcedf6);text-align:left;padding:14px 18px;font-size:.88rem;color:var(--ink);border-bottom:2px solid var(--line)}
td{padding:14px 18px;border-bottom:1px solid #e9f3f8;font-size:.93rem}
tbody tr:hover{background:#f3fafd}tbody tr:last-child td{border-bottom:0}
td small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;background:#e1f3fa;color:#0f6f8c;font-size:.82rem;font-weight:600}
.empty{padding:40px 18px;text-align:center;color:var(--muted)}
.count{padding:10px 18px;font-size:.8rem;color:var(--muted);border-top:1px solid #e9f3f8;background:#fafdfe}
dialog{border:0;border-radius:16px;padding:26px;width:min(420px,calc(100% - 32px));color:var(--ink);box-shadow:0 20px 60px rgba(11,74,99,.3)}
dialog::backdrop{background:rgba(11,74,99,.35)}
dialog h2{margin:0 0 4px;font-size:1.2rem}
label{display:block;font-size:.85rem;font-weight:600;margin:14px 0 6px}
dialog input,dialog select,dialog textarea{width:100%;padding:11px 12px;font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:10px;background:#fff}
.row{display:flex;gap:10px;margin-top:20px}.row .ib{flex:1;justify-content:center}
.err{color:var(--bad);font-size:.85rem;min-height:1.2em;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:26px 0 16px}.top h1{margin:0 0 4px}.top .sub{margin:0}
#b-upd{position:relative}#b-upd .pend{position:absolute;top:-5px;right:-5px;width:13px;height:13px;border-radius:50%;background:#f0a020;border:2px solid #fff}#b-upd .pend[hidden]{display:none}
.ed{width:38px;height:38px;border:0;border-radius:10px;background:none;color:var(--muted);cursor:pointer;display:inline-grid;place-items:center}.ed:hover{background:var(--soft);color:var(--ink)}.ed:focus-visible{outline:3px solid rgba(77,184,232,.55)}.ed svg{width:19px;height:19px}
td.ac{text-align:right;width:60px}#tb tr[data-id]{cursor:pointer}
td .nt{display:block;color:var(--muted);font-size:.78rem;margin-top:4px;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dialog textarea{resize:vertical;min-height:84px}.hint{font-size:.78rem;color:var(--muted);margin-top:5px}
input[readonly]{background:#f3f8fa;color:var(--muted)}
@media(max-width:640px){.logo{height:70px}.wrap{padding:14px 14px 40px}th,td{padding:12px}.ib span{display:none}.ib{padding:0 12px}.tools{width:100%}.search.open{width:100%;order:9}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function render(){
 var t=norm(q.value.trim()),L=P.filter(function(p){return !t||norm(p.n+" "+p.r+" "+p.x).indexOf(t)>-1});
 L.sort(function(a,b){return b.d<a.d?-1:b.d>a.d?1:0});
 tb.innerHTML=L.length?L.map(function(p){return "<tr data-id='"+esc(p.id)+"'><td>"+esc(p.n)+"<small>"+esc(p.r)+"</small></td><td>"+fd(p.d)+"</td><td><span class='tag'>"+esc(p.x)+"</span>"+(p.o?"<span class='nt'>"+esc(p.o)+"</span>":"")+"</td><td class='ac'><button class='ed' data-id='"+esc(p.id)+"' aria-label='Editar ficha de "+esc(p.n)+"'><svg viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4'/></svg></button></td></tr>"}).join(""):"<tr><td colspan='4' class='empty'>No hay pacientes que coincidan con la búsqueda.</td></tr>";
 $("cnt").textContent=L.length+" de "+P.length+" pacientes · actualizado "+stamp.toLocaleTimeString("es-CL",{hour:"2-digit",minute:"2-digit"});
}
q.addEventListener("input",render);
function setPend(v){$("pend").hidden=!v;$("b-upd").title=v?"Hay cambios nuevos. Presiona para actualizar":"Actualizar tabla"}
function chk(){var s=rd();if(s&&s.raw!==lastRaw)setPend(true)}
addEventListener("storage",function(e){if(e.key===KEY||e.key===null)chk()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)chk()});addEventListener("focus",chk);
$("b-upd").onclick=function(){var s=rd();if(!s){setPend(false);toast("La tabla ya estaba al día");return}
 var old={},ch=0;P.forEach(function(p){old[p.id]=JSON.stringify(p)});
 s.list.forEach(function(p){if(old[p.id]!==JSON.stringify(p))ch++;delete old[p.id]});ch+=Object.keys(old).length;
 P=s.list;lastRaw=s.raw;stamp=new Date();setPend(false);render();
 toast(ch?ch+(ch===1?" paciente actualizado":" pacientes actualizados"):"La tabla ya estaba al día")};

 $("e-n").value=cur.n;$("e-r").value=cur.r;$("e-d").value=cur.d;$("e-x").value=cur.x;$("e-o").value=cur.o||"";$("e-err").textContent="";$("d-ed").showModal()}

 if(!cur)return;if(n.length<3){$("e-err").textContent="Ingresa el nombre completo.";return}
 if(!d||!x){$("e-err").textContent="Completa la fecha y el diagnóstico.";return}
 cur.n=n;cur.d=d;cur.x=x;cur.o=$("e-o").value.trim();upsert(cur);render();$("d-ed").close();toast("Ficha actualizada")};

$("f-pac").onsubmit=function(e){e.preventDefault();var n=$("p-n").value.trim(),r=$("p-r").value.trim();
 if(n.length<3||!/^[\p{L}\s'.-]+$/u.test(n)){$("e-pac").textContent="Ingresa el nombre completo (solo letras).";return}
 if(!rutOk(r)){$("e-pac").textContent="El RUT no es válido. Formato: 12.345.678-5";return}
 var fr=rutFmt(r),s0=rd(),all=(s0?s0.list:[]).concat(P);
 if(all.some(function(p){return p.r===fr})){$("e-pac").textContent="Ese RUT ya está registrado.";return}
 var p={id:"p"+Date.now().toString(36),n:n,r:fr,d:new Date().toISOString().slice(0,10),x:"Sin diagnóstico",o:""};
 P.push(p);upsert(p);render();$("d-pac").close();toast("Paciente guardado")};

 $("f-p").innerHTML=P.map(function(p,i){return "<option value='"+i+"'>"+esc(p.n)+"</option>"}).join("");
 $("f-d").value=new Date().toISOString().slice(0,10);$("d-ficha").showModal()};

 if(!p||!d||!x){$("e-ficha").textContent="Completa paciente, fecha y diagnóstico.";return}
 p.d=d;p.x=x;upsert(p);render();$("d-ficha").close();toast("Ficha guardada")};
