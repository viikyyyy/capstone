<title>Hospital Aquiles Miro | Ingreso</title>
<style>
:root{--ink:#0b4a63;--muted:#5c7f90;--sky:#4db8e8;--sky-h:#38a8dc;--line:#cfe6f1}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 16px}
.logo{width:160px;height:auto;display:block;margin:0 auto 10px}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #e3f1f8;border-radius:16px;padding:32px 28px;box-shadow:0 10px 30px rgba(11,74,99,.08);text-align:center}
h1{font-size:1.3rem;margin:0 0 4px}
.sub{margin:0 0 26px;color:var(--muted);font-size:.92rem}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:var(--ink);transition:background .15s,border-color .15s,transform .1s}
.opt:hover{background:#eaf7fd;border-color:var(--sky)}
.opt:active{transform:scale(.99)}
.opt:focus-visible{outline:3px solid rgba(77,184,232,.6);outline-offset:2px}
.ic{flex:0 0 auto;width:44px;height:44px;border-radius:10px;background:var(--sky);display:flex;align-items:center;justify-content:center}
.ic svg{width:24px;height:24px;stroke:#06364d;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.txt strong{display:block;font-size:1rem}
.txt span{display:block;font-size:.82rem;color:var(--muted);margin-top:2px}
.arrow{margin-left:auto;color:var(--sky-h);font-size:1.2rem}
</style>
